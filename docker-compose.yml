
services:
  postgres:
    image: postgres:16
    container_name: school_admission_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: schooluser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolpass}
      POSTGRES_DB: schooladmission

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/SchoolAdmission.Tests/Database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schooluser -d schooladmission"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/SchoolAdmission.Api/Dockerfile

    container_name: school_admission_api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=schooladmission;Username=schooluser;Password=${POSTGRES_PASSWORD:-schoolpass}"

      Jwt__Secret: "${JWT_SECRET:?JWT_SECRET missing}"
      Jwt__Issuer: "${JWT_ISSUER:-SchoolAdmission.Api}"
      Jwt__Audience: "${JWT_AUDIENCE:-SchoolAdmission.Students}"

    ports:
      - "5069:8080"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VITE_API_URL: /api

    container_name: school_admission_frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend

volumes:
  postgres_data:
