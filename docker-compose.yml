services:
  postgres:
    image: postgres:16
    container_name: school_admission_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: schooluser
      POSTGRES_PASSWORD: schoolpass
      POSTGRES_DB: schooladmission
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schooluser -d schooladmission"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: